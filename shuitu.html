        </p>
        <h1 class="map-title" id="mapTitle"><span>一方水土，</span><em>养一方味</em></h1>
        <p class="map-lead">长江、赣江与黄河，各自把三餐写进一方水土。<br />点开一处，便走进那里的早市与灶台。</p>
      </div>

      <p class="map-side" aria-hidden="true">水 · 土 · 人 · 味</p>
    </section>

        <div class="province-switch" id="provinceSwitch" role="tablist" aria-label="切换省份"></div>

      <div class="orbit-stage" id="orbitStage" tabindex="0" aria-label="三道菜的六张照片环绕展示，可左右拖动或按方向键旋转">
